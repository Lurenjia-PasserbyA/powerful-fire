<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B0A0E'/%3E%3Ccircle cx='32' cy='38' r='14' fill='%23FF6B35'/%3E%3Ccircle cx='32' cy='26' r='8' fill='%23FFB347'/%3E%3C/svg%3E"
    />
    <title>Powerful Fire</title>
  </head>
  <body>
    <div id="app">
      <div id="stage" class="stage"></div>

      <div id="hud" class="hud">
        <div class="hurt" id="hud-hurt"></div>
        <section class="panel hud-xp">
          <div class="level-badge" id="hud-level">LV 1</div>
          <div class="xp">
            <div class="xp__row">
              <span class="panel__label">Experience</span>
              <span class="xp__value" id="hud-xp-value">0 / 100</span>
            </div>
            <div class="xp__track">
              <div class="xp__fill" id="hud-xp-fill"></div>
            </div>
          </div>
        </section>

        <section class="panel hud-map">
          <span class="panel__label">Minimap</span>
          <div class="map">
            <div class="map__base" title="基地"></div>
            <div class="map__player" id="hud-map-player"></div>
          </div>
          <div class="panel__hint" id="hud-wave">WAVE 0 · KILL 0</div>
        </section>

        <section class="panel hud-vitals">
          <div class="vitals__row">
            <span class="panel__label">HP</span>
            <span class="vitals__value" id="hud-hp-value">100 / 100</span>
          </div>
          <div class="hp__track">
            <div class="hp__fill" id="hud-hp-fill"></div>
            <div class="hp__shield" id="hud-shield-fill"></div>
          </div>
          <div class="stamina__row">
            <span class="panel__label">Stamina</span>
            <span class="stamina__value" id="hud-stamina-value">100 / 100</span>
          </div>
          <div class="stamina__track" id="hud-stamina-track">
            <div class="stamina__fill" id="hud-stamina-fill"></div>
          </div>
          <div class="status-row" id="hud-status"></div>
          <div class="zone-chip" id="hud-zone">基地 · 安全</div>
        </section>

        <section class="panel hud-slots" id="hud-slots">
          <div class="slot" data-slot="0">
            <span class="slot__key">1</span>
            <span class="slot__name">未装配</span>
            <div class="slot__mask"></div>
            <span class="slot__cd"></span>
          </div>
          <div class="slot" data-slot="1">
            <span class="slot__key">2</span>
            <span class="slot__name">未装配</span>
            <div class="slot__mask"></div>
            <span class="slot__cd"></span>
          </div>
          <div class="slot" data-slot="2">
            <span class="slot__key">3</span>
            <span class="slot__name">未装配</span>
            <div class="slot__mask"></div>
            <span class="slot__cd"></span>
          </div>
        </section>

        <section class="panel hud-ultimate">
          <div class="ult-ring" id="hud-ult-ring">
            <div class="ult-ring__fill" id="hud-ult-fill"></div>
            <span class="ult-ring__key">R</span>
            <span class="ult-ring__value" id="hud-ult-value">0%</span>
          </div>
          <div class="ult__name" id="hud-ult-name">未装配</div>
        </section>

        <div class="hint-bar" id="hint-bar">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
          <span><kbd>左键</kbd> 放技能</span>
          <span><kbd>右键</kbd> 闪避</span>
          <span><kbd>滚轮</kbd> 换槽</span>
          <span><kbd>Tab</kbd> 商店</span>
        </div>

        <div class="diag" id="hud-diag">FPS 0</div>
        <div class="toast" id="hud-toast"></div>
        <div class="levelup" id="hud-levelup"></div>
        <div class="save-chip" id="hud-save">SAVED</div>
        <button class="camp-prompt" id="camp-prompt" type="button"></button>
        <div class="fx" id="fx"></div>
      </div>

      <div id="shop" class="shop" aria-hidden="true"></div>
      <div id="upgrade" class="shop" aria-hidden="true"></div>
      <div id="touch" class="touch" aria-hidden="true"></div>

      <div class="boot" id="boot">
        <div>
          <div class="boot__mark">Powerful <span>Fire</span></div>
          <div class="boot__bar"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
